# Route each public domain to its basin page.
# $route_host prefers X-Forwarded-Host (set by an upstream proxy that rewrites the Host header)
# and falls back to the raw Host header when there is no proxy in front. $basin_home then maps
# that hostname to a basin landing path. YOM_HOST / PING_HOST come from the env and must be
# non-empty — an empty map key is invalid nginx (defaults live in the .env files).
map $http_x_forwarded_host $route_host {
    ""       $host;
    default  $http_x_forwarded_host;
}

map $route_host $basin_home {
    default       /forecast/yom;
    ${YOM_HOST}   /forecast/yom;
    ${PING_HOST}  /forecast/ping;
}

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME} ${YOM_HOST} ${PING_HOST};

    # Docker DNS resolver with 10s cache
    resolver 127.0.0.11 valid=10s;

    # Issue relative redirects (Location: /forecast/ping, not http://host/...). If TLS is
    # terminated by an upstream proxy that forwards http to us, an absolute redirect would send
    # users to http:// and downgrade the scheme; a relative Location is resolved by the browser
    # against the real origin, so it is correct whether the public URL is http or https.
    absolute_redirect off;

    client_max_body_size 64M;

    # Increase proxy buffer sizes for large GeoJSON responses
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # Enable gzip compression
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1000;
    gzip_vary on;

    # Shapefile downloads - served directly from disk
    location /downloads/ {
        alias /app/downloads/;
        add_header Content-Disposition 'attachment';
    }

    # Root: redirect to this host's basin page (yom by default, ping on PING_HOST).
    # Exact-match so only "/" is redirected; all app assets/routes fall through below.
    location = / {
        return 302 $basin_home;
    }

    # Frontend - Next.js
    location / {
        set $nextjs_upstream http://nextjs:3000;
        proxy_pass $nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Tile server - tileserver-gl
    location /tiles/ {
        set $tileserver_upstream http://tileserver:8080;
        rewrite ^/tiles/(.*) /$1 break;
        proxy_pass $tileserver_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=86400";
    }

    # API - NestJS
    location /api {
        set $nestjs_upstream http://nestjs:3001;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $nestjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Diagnostic probe — reveals what THIS server actually receives from the edge.
    # Point a domain at .114 and open http(s)://<domain>/whoami to read:
    #   host      = raw Host header (is the client domain preserved?)
    #   route     = hostname used for basin routing (X-Forwarded-Host if present, else Host)
    #   basin     = resolved landing path for that hostname
    #   scheme    = scheme nginx sees (http if TLS is terminated upstream)
    #   xfproto   = X-Forwarded-Proto from an upstream proxy (real client scheme, if set)
    #   xfhost    = X-Forwarded-Host from an upstream proxy (if set)
    # Remove this block once the topology is confirmed.
    location = /whoami {
        access_log off;
        default_type text/plain;
        return 200 "host=$host\nroute=$route_host\nbasin=$basin_home\nscheme=$scheme\nxfproto=$http_x_forwarded_proto\nxfhost=$http_x_forwarded_host\n";
    }
}
